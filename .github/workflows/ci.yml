name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Tests run on synthetic fixtures with the AI stubbed, so skip the multi-GB
      # AI packages (torch, transformers, psutil) — llm.py imports them lazily.
      - name: Install dependencies
        run: |
          grep -vE '^\s*(#|$)|^(torch|transformers|psutil)' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt
      - name: Run pytest
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
